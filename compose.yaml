name: storyteller

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: storyteller
      POSTGRES_USER: storyteller
      POSTGRES_PASSWORD: storyteller
    ports:
      # Loopback-only: the dev database must not be reachable from other hosts on an
      # untrusted network. The port stays published so a host-side psql or GUI client
      # still works; the storyteller/storyteller credentials are a dev convenience that
      # is only safe because this socket is not exposed beyond 127.0.0.1.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyteller -d storyteller"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
